[project]
name = "newsren"
version = "0.1.0"
description = "The Newsren: agentic news intelligence for technology, education, industry, and finance"
readme = "README.md"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.3,<3",
    "fastapi>=0.115",
    "feedparser>=6.0",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
newsren = "newsren:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:feedparser.*"]

[tool.ruff]
line-length = 115
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "UP046", "UP047", "SIM905", "SIM105", "SIM108"]
